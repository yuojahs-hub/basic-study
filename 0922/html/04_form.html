<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>입력 방식</title>
    </head>
    <body>
        <form>아이디 : <input type="text" /> 비밀번호 : <input type="password" /></form>

        <form><input type="text" /> - 이름 <input type="text" /> -학번</form>
        <hr />
        <form action="">
            <label for="user">아이디</label>
            <input type="text" id="user" />
            <br />
            <label for="pass">비밀번호</label>
            <input type="password" id="pass" />
        </form>
        <hr />
        <form action="">
            아이디 : <input type="text" /> <br />
            패스워드 : <input type="password" /> <br />
            이메일 : <input type="email" /> <br />
            URL : <input type="url" /> <br />
            전화번호 : <input type="tel" /> <br />
            색상 : <input type="color" /> <br />
            월 : <input type="month" /> <br />
            날짜 : <input type="date" /> <br />
            주 : <input type="week" /> <br />
            시간 : <input type="time" /> <br />
            지역시간 : <input type="datetime-local" /> <br />
            숫자 : <input type="number" min="200" max="320" step="5" /> <br />
            범위 : <input type="range" min="0" max="100" step="10" /> <br />
            <input type="submit" value="SEND" />
            <input type="reset" value="RESET" />
            <button onclick="alert('안녕하세요')"><image src="../img/botton.png" width="50" alt="" /></button>
        </form>
    </body>
</html>
