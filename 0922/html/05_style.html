<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="../css/style.css" />
        <style>
            /*선택자 {속성 : 속성값}*/
            h1 {
                color: blue;
                background-color: pink;
            }
            h2 {
                color: red;
                background-color: yellow;
            }
        </style>
    </head>
    <body>
        <h1>스타일시트(css) 만들기</h1>
        <!-- 스타일 시트 종류 3가지
    1) 내부 스타일 시트: html 문서 안 <head>태그 안에 <style>로 작성
    2) 외부 스타일 시트: style.css 파일을 따로 만들어 <link>하기
    3) 인라인 스타일 시트: 태그의 속성으로 직접 입력 -->

        <!-- 내부 스타일시트 -->
        <h2>안녕하세요</h2>
        <p style="color: aqua">반가워</p>
        <h3>점심은 먹었어?</h3>
    </body>
</html>
