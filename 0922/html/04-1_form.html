<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <form>
            성별: <br />
            <label for="male">남성 </label>
            <input type="radio" id="male" name="gender" /> <br />

            <label for="female">여성 </label>
            <input type="radio" id="female" name="gender" /> <br />
            <!-- label의 for 속성은 해당 label이 연결할 input 요소의 id와 일치해야 함 -->
            <!-- 두 개의 radio의 name이 일치해야 함 -->
            <!-- radio의 속성은 중복 선택 불가능 -->
        </form>

        <form>
            <p>내가 좋아하는 과일은?</p>
            <input type="checkbox" name="fruits" value="apple" /> 사과 <br />
            <input type="checkbox" name="fruits" value="banana" /> 바나나 <br />
            <input type="checkbox" name="fruits" value="orange" /> 오렌지 <br />
            <input type="checkbox" name="fruits" value="peach" /> 복숭아 <br />
            <input type="checkbox" name="fruits" value="grape" /> 포도 <br />
            <input type="checkbox" name="fruits" value="strawberry" /> 딸기 <br />

            <!--  checkbox는 중복 선택 가능 -->
            <input type="submit" value="입력 완료" onclick="alert('입력이 완료되었습니다!')" />
        </form>
    </body>
</html>
