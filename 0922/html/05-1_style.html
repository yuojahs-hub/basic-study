<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            /* 선택자 { 속성: 속성값; } */
            h1 {
                color: blue;
                background-color: pink;
            }
            #study {
                color: red;
                background-color: yellow;
            }
            p {
                color: aqua;
                background-color: gray;
            }
            .evening {
                color: green;
                background-color: orange;
            }
        </style>
    </head>
    <body>
        <h1>안녕하세요</h1>
        <h2>반갑습니다</h2>
        <p class="evening">또 만나요</p>
        <h1 id="study">열심히 공부합시다</h1>
        <p>점심 맛있게 드셨나요</p>
        <p class="evening">저녁 맛있게 드셨나요</p>
        <p>아침 맛있게 드셨나요</p>
        <p class="evening">간식 맛있게 드셨나요</p>
        <p>야식 맛있게 드셨나요</p>

        <!--  
        선택자 { 속성: 속성값; }
        선택자의 종류
        1) 태그   - h1, p, div 등
        2) ID     - #study
        3) Class   - .evening

        아이디, 클래스 이름 만들 때 규칙
        
        한글 금지
        숫자 + 영문 금지
        띄어쓰기 금지
        특수문자 금지
        첫글자 대문자 금지
        의미 없는 글자 금지 (ex. aaaaa, vvv등)

        영문 + 숫자 가능
        특수문자 중에서 _, - 가능 (언더바 추천 드래그 한 번에 가능)
        팀원들이 서로 이해할 수 있는 의미있는 단어 사용 (banner, item 등)

        -->
    </body>
</html>
