<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>layout - float</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            #wrap {
                width: 900px;
                margin: 0 auto;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: #06ff82;
            }
            #main {
                width: 100%;
                overflow: hidden;
                /* 자식을 감쌈 (부모한테 사용) */
            }
            #main #section01 {
                width: 300px;
                height: 600px;
                background-color: #beffe4;
                float: left;
            }
            #main #section02 {
                width: 300px;
                height: 600px;
                background-color: #a4e7cb;
                float: left;
            }
            #main #section03 {
                width: 300px;
                height: 600px;
                background-color: #335f4d;
                float: left;
            }
            #footer {
                width: 100%;
                height: 100px;
                background-color: #11aa5e;
                /* clear: both; */
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <header id="header">header</header>
            <main id="main">
                <section id="section01">section01</section>
                <section id="section02">section02</section>
                <section id="section03">section03</section>
            </main>
            <footer id="footer">footer</footer>
        </div>
    </body>
</html>
