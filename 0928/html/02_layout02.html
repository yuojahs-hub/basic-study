<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>layout01 - flex</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            #wrap {
                width: 900px;
                margin: 0 auto;
                display: flex;
                /* gap: 10px; 계산 필수 jc는 계산 불필요 */
                justify-content: space-between;
            }
            #header {
                width: 290px;
                height: 600px;
                background-color: #06ff82;
                /* margin-right: 10px; */
            }

            #section01 {
                width: 600px;
                height: 100px;
                background-color: #adffdd;
            }
            #section02 {
                width: 600px;
                height: 380px;
                background-color: #13ffd8;
                margin: 10px 0;
            }
            #section03 {
                width: 600px;
                height: 100px;
                background-color: #c5ffff;
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <header id="header">header</header>
            <main id="main">
                <section id="section01">section01</section>
                <section id="section02">section02</section>
                <section id="section03">section03</section>
            </main>
        </div>
    </body>
</html>
