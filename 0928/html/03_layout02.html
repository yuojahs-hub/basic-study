<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>layout - flex</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            #wrap {
                width: 900px;
                margin: 0 auto;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: #06ff82;
            }
            #main {
                width: 100%;
                display: flex;
            }
            #main #section01 {
                flex: 1;
                height: 600px;
                background-color: #beffe4;
            }
            #main #section02 {
                flex: 1;
                height: 600px;
                background-color: #a4e7cb;
            }
            #main #section03 {
                flex: 1;
                height: 600px;
                background-color: #335f4d;
            }
            #footer {
                width: 100%;
                height: 100px;
                background-color: #11aa5e;
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <header id="header">header</header>
            <main id="main">
                <section id="section01">section01</section>
                <section id="section02">section02</section>
                <section id="section03">section03</section>
            </main>
            <footer id="footer">footer</footer>
        </div>
    </body>
</html>
