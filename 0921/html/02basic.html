<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>웹사이트</title>
    </head>
    <body>
        <!-- p테드는 단락테드이며 브라우저의 한 줄 전체를 차지한다 -->
        <p>안녕하세요</p>
        <p>반갑습니다</p>
        <p>또 만나요</p>
        <!-- ctrl + / : 주석처리 -->
        <!-- 주석은 브라우저에 처리가 안 된다 -->
         <p>대통령의 국법상 행위는 문서로써 하며, 이 문서에는 국무총리와 관계 국무위원이 부서한다. <br> 군사에 관한 것도 또한 같다. <br> 법률이 정하는 주요방위산업체에 종사하는 근로자의 단체행동권은 법률이 정하는 바에 의하여 이를 제한하거나 인정하지 아니할 수 있다.</p>
    </body>
</html>
