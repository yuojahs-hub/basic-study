<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>표 만들기</title>
    </head>

    <body>
        <table border="1">
            <tr>
                <td>칼라</td>
                <td>수량</td>
                <td>배송지 입력</td>
            </tr>
            <tr>
                <td>노랑색</td>
                <td rowspan="2">100개</td>
                <td>천호동</td>
            </tr>
            <tr>
                <td>빨간색</td>
                <td>명일동13-1</td>
            </tr>
        </table>
        <hr />
        <table border="1">
            <tr>
                <td>11111</td>
                <td>33333</td>
            </tr>
            <tr>
                <td>4444</td>
                <td>555</td>
            </tr>
            <tr>
                <td>6666</td>
                <td>7777</td>
            </tr>
        </table>
        <hr />
        <table border="1">
            <caption>
                아트박스 물품
            </caption>
            <tr>
                <th>문구류</th>
                <th>개수</th>
                <th>색상</th>
            </tr>
            <tr>
                <td>색종이</td>
                <td rowspan="2">10000개</td>
                <td>노랑</td>
            </tr>
            <tr>
                <td>지우개</td>
                <td rowspan="2">빨강</td>
            </tr>
            <tr>
                <td>연필</td>
                <td>500개</td>
            </tr>
        </table>
    </body>
</html>
