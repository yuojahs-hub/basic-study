<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            h3:hover {
                color: red;
            }
            li {
                list-style: none;
                font-size: 30px;
                font-weight: bold;
            }
            li:first-child {
                color: blue;
            }
            li:nth-child(2) {
                color: chocolate;
            }
            li:nth-child(3) {
                color: darkgoldenrod;
            }
            li:nth-child(4) {
                color: hotpink;
            }
            li:nth-child(5) {
                color: beige;
            }
            li:nth-child(6) {
                color: gold;
            }
            li:nth-child(7) {
                color: forestgreen;
            }
            li:nth-child(8) {
                color: brown;
            }
            li:nth-child(9) {
                color: lavender;
            }
            li:last-child {
                color: olive;
            }
        </style>
    </head>
    <body>
        <h2>가상클래스 = 의사클래스</h2>
        <h3>마우스 오버</h3>
        <ul>
            <li>001</li>
            <li>002</li>
            <li>003</li>
            <li>004</li>
            <li>005</li>
            <li>006</li>
            <li>007</li>
            <li>008</li>
            <li>009</li>
            <li>010</li>
        </ul>
    </body>
</html>
