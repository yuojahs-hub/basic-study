<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            header {
                width: 600px;
                height: 200px;
                background-color: aliceblue;
                margin: 0 auto;
                position: relative;
                /* 절대 좌표의 기준점 */
            }
            #logo {
                width: 80px;
                height: 80px;
                background-color: aqua;
                position: absolute;
                top: 20px;
                left: 20px;
            }
            nav {
                width: 300px;
                height: 80px;
                background-color: aquamarine;
                position: absolute;
                left: 150px;
                top: 100px;
            }
            #login {
                width: 100px;
                height: 50px;
                background-color: darkgray;
                position: absolute;
                right: 10px;
                bottom: 10px;
            }
        </style>
    </head>
    <body>
        <header>
            <div id="logo">LOGO</div>
            <nav>nav</nav>
            <div id="login">LogIn</div>
        </header>
    </body>
</html>
