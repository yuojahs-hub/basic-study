<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            div {
                width: 100px;
                height: 100px;
            }
            #box01 {
                background-color: antiquewhite;
            }
            #box02 {
                background-color: aqua;
                position: absolute;
                left: 10px;
                top: 10px;
                z-index: 100;
            }
            #box03 {
                background-color: aquamarine;
                position: absolute;
                left: 20px;
                top: 20px;
                z-index: 101;
            }
            #box04 {
                background-color: azure;
                position: absolute;
                top: 50px;
                left: 50px;
            }
        </style>
    </head>
    <body>
        <div id="box01">1</div>
        <div id="box02">2</div>
        <div id="box03">3</div>
        <div id="box04">4</div>
        <!-- 
        ***position***
        1) static
        2) absolute
        3) reletive
        4) fixed
        -->
    </body>
</html>
