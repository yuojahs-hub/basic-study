<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            h1:nth-of-type(3) {
                color: red;
            }
            h1:first-of-type {
                color: blue;
            }
            h1:last-of-type {
                color: blueviolet;
            }
            div {
                width: 100px;
                height: 100px;
                background-color: yellow;
                text-align: center;
                line-height: 100px;

                border-radius: 10px 20px 5px 30px;
            }
        </style>
    </head>
    <body>
        <h1>111111</h1>
        <h2>222222</h2>
        <h3>333333</h3>
        <h1>111111</h1>
        <h1>111111</h1>
        <h2>222222</h2>

        <div>박스</div>
    </body>
</html>
